<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>松鼠逛逛 · 管理后台</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #f5f7fb;
            overflow: hidden;
        }
        #adminApp {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ★★★ 登录页面 - 居中显示 ★★★ */
        #adminLogin {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
        }
        .login-box {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 24px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* ★★★ 后台主体 ★★★ */
        .admin-container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 16px 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
            width: 100%;
            background: #f5f7fb;
        }

        .admin-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
            flex-shrink: 0;
        }
        .admin-header h1 { font-size: 22px; margin: 0; }

        .search-bar { 
            display: flex; 
            flex-direction: column;
            gap: 8px; 
            background: white; 
            padding: 12px 16px; 
            border-radius: 14px; 
            border: 1px solid #eef2f6; 
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .search-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            align-items: center;
        }
        .search-bar input, .search-bar select {
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid #dce3eb;
            font-size: 13px;
            outline: none;
            background: white;
            min-width: 100px;
            height: 34px;
        }
        .search-bar input:focus, .search-bar select:focus {
            border-color: #1f7b4d;
        }
        .search-bar .search-input-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .search-bar .search-input-group label {
            font-size: 12px;
            color: #5e6f7d;
            font-weight: 500;
            white-space: nowrap;
        }
        .search-bar .clear-btn {
            background: #eef2f6;
            color: #1a2e3b;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            height: 34px;
            transition: 0.2s;
        }
        .search-bar .clear-btn:hover {
            background: #dce3eb;
        }

        .table-area {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            border-radius: 14px;
            border: 1px solid #eef2f6;
            background: white;
            min-height: 0;
        }
        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 13px;
        }
        .table-wrapper thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .table-wrapper thead th {
            background: #1a2e3b;
            color: white;
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
            white-space: nowrap;
            position: sticky;
            top: 0;
        }
        .table-wrapper tbody td {
            padding: 8px 12px;
            border-bottom: 1px solid #eef2f6;
            font-size: 13px;
        }
        .table-wrapper tbody tr:hover {
            background: #f8faff;
        }
        .table-wrapper .row-num {
            color: #888;
            font-size: 12px;
            text-align: center;
        }

        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 16px;
            background: white;
            border-radius: 0 0 14px 14px;
            border: 1px solid #eef2f6;
            border-top: none;
            flex-shrink: 0;
            margin-top: -1px;
        }
        .pagination-bar .page-info {
            font-size: 13px;
            color: #5e6f7d;
        }
        .pagination-bar .page-info strong {
            color: #1a2e3b;
        }
        .pagination-bar .page-controls {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }
        .pagination-bar .page-controls button {
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #dce3eb;
            background: white;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
            height: 30px;
        }
        .pagination-bar .page-controls button:hover:not(:disabled) {
            background: #1f7b4d;
            color: white;
            border-color: #1f7b4d;
        }
        .pagination-bar .page-controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination-bar .page-controls .page-num {
            padding: 4px 8px;
            border-radius: 30px;
            border: 1px solid #dce3eb;
            background: white;
            font-size: 12px;
            min-width: 28px;
            text-align: center;
            cursor: pointer;
            height: 28px;
            line-height: 18px;
        }
        .pagination-bar .page-controls .page-num.active {
            background: #1f7b4d;
            color: white;
            border-color: #1f7b4d;
        }
        .pagination-bar .page-controls select {
            padding: 4px 8px;
            border-radius: 30px;
            border: 1px solid #dce3eb;
            font-size: 12px;
            outline: none;
            background: white;
            height: 30px;
        }

        .tag { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .tag-beginner { background: #eef5f0; color: #1f7b4d; }
        .tag-advanced { background: #d4e3f0; color: #1a4d7a; }
        .tag-senior { background: #f0e6d4; color: #7a5a1a; }
        .tag-elite { background: #f0d4e6; color: #7a1a5a; }

        .hidden { display: none !important; }
        .msg { background: #eef5f0; padding: 10px 14px; border-radius: 40px; color: #1a4d33; font-size: 14px; margin: 12px 0 8px; }
        .msg.error { background: #f8dddd; color: #8b3a3a; }
        .btn { background: #1a2e3b; color: white; font-weight: 500; font-size: 15px; padding: 14px 18px; border-radius: 60px; width: 100%; cursor: pointer; border: none; transition: 0.15s; margin-top: 6px; }
        .btn:hover { background: #2a4e5b; }
        .btn-outline { background: transparent; border: 1.5px solid #d0d9e2; color: #1a2e3b; width: auto; padding: 6px 16px; font-size: 13px; border-radius: 30px; cursor: pointer; }
        .btn-outline:hover { background: #eef2f6; }
        .input-field { width: 100%; padding: 14px 16px; border-radius: 40px; border: 1px solid #dce3eb; font-size: 16px; margin-bottom: 12px; outline: none; display: block; box-sizing: border-box; }
        .input-field:focus { border-color: #1f7b4d; }
        .reset-btn { background: #1f7b4d; color: white; border: none; padding: 4px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; transition: 0.2s; height: 28px; }
        .reset-btn:hover { background: #16633b; }
        .fix-level-btn { background: #d4a017; color: white; border: none; padding: 4px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; transition: 0.2s; height: 28px; }
        .fix-level-btn:hover { background: #b8890f; }
        .flex-1 { flex: 1; min-width: 140px; }
        .flex-1 input { width: 100%; }
        .action-btns { display: flex; gap: 4px; flex-wrap: wrap; }

        @media (max-width: 768px) {
            .admin-container { padding: 10px; }
            .search-bar { padding: 10px; }
            .table-wrapper th, .table-wrapper td { padding: 4px 6px; font-size: 11px; }
            .pagination-bar { flex-direction: column; align-items: stretch; text-align: center; }
            .pagination-bar .page-controls { justify-content: center; }
            .login-box { margin: 20px; }
        }
    </style>
</head>
<body>
<div id="adminApp">
    <!-- ★★★ 登录界面 ★★★ -->
    <div id="adminLogin">
        <div class="login-box card">
            <h2>🔐 管理员登录</h2>
            <input id="adminUser" class="input-field" type="text" placeholder="用户名" value="admin">
            <input id="adminPass" class="input-field" type="password" placeholder="密码">
            <button id="adminLoginBtn" class="btn">登录</button>
            <div id="adminLoginMsg" class="msg hidden"></div>
        </div>
    </div>

    <!-- ★★★ 后台界面 ★★★ -->
    <div id="adminDashboard" class="hidden admin-container">
        <div class="admin-header">
            <h1>📊 商家学习总览</h1>
            <button id="adminLogoutBtn" class="btn-outline">退出</button>
        </div>
        
        <div class="search-bar">
            <div class="search-row">
                <div class="search-input-group flex-1">
                    <label>📱</label>
                    <input id="searchPhone" type="text" placeholder="手机号搜索...">
                </div>
                <div class="search-input-group flex-1">
                    <label>🏪</label>
                    <input id="searchName" type="text" placeholder="店铺名搜索...">
                </div>
                <div class="search-input-group">
                    <label>等级</label>
                    <select id="searchLevel">
                        <option value="">全部</option>
                        <option value="beginner">入门</option>
                        <option value="advanced">进阶</option>
                        <option value="senior">资深</option>
                        <option value="elite">精英</option>
                    </select>
                </div>
                <div class="search-input-group">
                    <label>阶段</label>
                    <select id="searchStage">
                        <option value="">全部</option>
                        <option value="1">第一阶段</option>
                        <option value="2">第二阶段</option>
                        <option value="3">第三阶段</option>
                        <option value="4">第四阶段</option>
                        <option value="5">第五阶段</option>
                        <option value="6">第六阶段</option>
                    </select>
                </div>
                <button class="clear-btn" id="clearSearchBtn">清空</button>
            </div>
            <div class="search-row" style="border-top:1px solid #eef2f6; padding-top:8px;">
                <div class="search-input-group">
                    <label>注册从</label>
                    <input id="searchDateFrom" type="date">
                </div>
                <div class="search-input-group">
                    <label>到</label>
                    <input id="searchDateTo" type="date">
                </div>
                <span style="font-size:12px; color:#888; margin-left:auto;" id="searchStats">共 <strong id="totalCount">0</strong> 条，当前 <strong id="filteredCount">0</strong> 条</span>
            </div>
        </div>

        <div class="table-area">
            <div id="adminContent" style="flex:1; display:flex; flex-direction:column; min-height:0;"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
