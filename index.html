<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>松鼠逛逛 · 商家学堂</title>

        * {

            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 20, 30, 0.08);
            padding: 24px 20px 30px;
            position: relative;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-left h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a2e3b;
            letter-spacing: -0.3px;
        }
        .badge {
            background: #eef5f0;
            color: #1f7b4d;
            font-size: 12px;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 30px;
        }
        /* 头像 & 下拉菜单 */
        .avatar-wrapper {
            position: relative;
            cursor: pointer;
        }
        .avatar-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1a2e3b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
            text-transform: uppercase;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            border: 2px solid #eef2f6;
            transition: 0.2s;
        }
        .avatar-circle:hover {
            border-color: #1f7b4d;
        }
        .avatar-circle.has-avatar {
            background-size: cover;
            background-position: center;
        }
        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 48px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            padding: 8px 0;
            min-width: 150px;
            display: none;
            z-index: 100;
            border: 1px solid #e4eaf0;
        }
        .dropdown-menu.open {
            display: block;
        }
        .dropdown-item {
            padding: 10px 18px;
            font-size: 14px;
            color: #1a2e3b;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.1s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .dropdown-item:hover {
            background: #f0f5fa;
        }
        .dropdown-item.danger {
            color: #b33;
        }
        .dropdown-item.danger:hover {
            background: #fde8e8;
        }

        .sub {
            color: #5e6f7d;
            font-size: 14px;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ecf0f3;
        }
        .card {
            background: #f8faff;
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 16px;
            border: 1px solid #eef2f6;
        }
        .level-tag {
            background: #1a2e3b;
            color: white;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
        }
        .status {
            font-size: 14px;
            color: #1f2e3a;
            margin: 8px 0 4px;
        }
        .progress-wrap {
            background: #e6eaef;
            height: 8px;
            border-radius: 20px;
            margin: 12px 0 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #1f7b4d;
            border-radius: 20px;
            transition: width 0.4s ease;
        }
        .btn {
            background: #1a2e3b;
            border: none;
            color: white;
            font-weight: 500;
            font-size: 15px;
            padding: 14px 18px;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 12px rgba(26, 46, 59, 0.08);
            margin-top: 6px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #d0d9e2;
            color: #1f2e3a;
            box-shadow: none;
        }
        .btn-outline:active { background: #f0f4fa; }
        .gap { height: 10px; }
        .quiz-area {
            margin-top: 20px;
            border-top: 1px solid #e4eaf0;
            padding-top: 18px;
        }
        .quiz-title {
            font-weight: 600;
            color: #1a2e3b;
            margin-bottom: 12px;
        }
        .option {
            background: #f2f6fc;
            padding: 12px 16px;
            border-radius: 40px;
            margin-bottom: 8px;
            font-size: 14px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: 0.1s;
        }
        .option.selected {
            border-color: #1f7b4d;
            background: #e3f3ea;
        }
        .option.correct { background: #d4edda; border-color: #1f7b4d; }
        .option.wrong { background: #f8dddd; border-color: #b33; }
        .disabled-click { pointer-events: none; opacity: 0.8; }
        .msg {
            background: #eef5f0;
            padding: 10px 14px;
            border-radius: 40px;
            color: #1a4d33;
            font-size: 14px;
            margin: 12px 0 8px;
        }
        .msg.error {
            background: #f8dddd;
            color: #8b3a3a;
        }
        .footnote {
            font-size: 12px;
            color: #7b8b9a;
            text-align: center;
            margin-top: 20px;
        }
        .hidden { display: none; }
        .flex { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(2px);
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-card {
            background: white;
            max-width: 400px;
            width: 100%;
            border-radius: 28px;
            padding: 24px 22px 30px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.2);
        }
        .modal-card h3 {
            font-size: 20px;
            font-weight: 600;
            color: #1a2e3b;
            margin-bottom: 16px;
        }
        .modal-card input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 40px;
            border: 1px solid #dce3eb;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
            transition: border 0.2s;
        }
        .modal-card input:focus {
            border-color: #1f7b4d;
        }
        .modal-card .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .modal-card .btn-row .btn {
            flex: 1;
            margin-top: 0;
        }
        .modal-card .btn-row .btn-outline {
            background: transparent;
            border: 1.5px solid #d0d9e2;
            color: #1f2e3a;
        }
        .modal-msg {
            margin: 8px 0 12px;
            font-size: 14px;
        }
        /* 文件上传隐藏 */
        #avatarFileInput {
            display: none;
        }
        .upload-label {
            display: inline-block;
            background: #eef5f0;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            color: #1f7b4d;
            font-weight: 500;
            margin-bottom: 12px;
        }
    </style>
</head>

        if (avatarUrl) {
            avatarCircle.style.backgroundImage = `url(${avatarUrl})`;
            avatarCircle.style.backgroundSize = 'cover';
            avatarCircle.style.backgroundPosition = 'center';
            avatarCircle.textContent = '';
            avatarCircle.classList.add('has-avatar');
        } else {
            avatarCircle.style.backgroundImage = '';
            avatarCircle.textContent = (user.name || '商').charAt(0).toUpperCase();
            avatarCircle.classList.remove('has-avatar');
        }
        // 模态框预览同步
        if (avatarUrl) {
            modalAvatarPreview.style.backgroundImage = `url(${avatarUrl})`;
            modalAvatarPreview.style.backgroundSize = 'cover';
            modalAvatarPreview.style.backgroundPosition = 'center';
            modalAvatarPreview.textContent = '';
        } else {
            modalAvatarPreview.style.backgroundImage = '';
            modalAvatarPreview.textContent = (user.name || '商').charAt(0).toUpperCase();
        }
    }

    // 渲染测验
    function renderQuiz(stage) {
        const quiz = getQuizForStage(stage);
        quizContainer.innerHTML = '';
        quizResult.classList.add('hidden');
        if (!quiz) {
            quizContainer.innerHTML = '<div style="padding:12px 0; color:#5e6f7d;">📭 本阶段暂无考核，可继续学习。</div>';
            submitQuizBtn.disabled = true;
            submitQuizBtn.style.opacity = 0.6;
            return;
        }
        submitQuizBtn.disabled = false;
        submitQuizBtn.style.opacity = 1;
        quizAnswers = new Array(quiz.questions.length).fill(null);
        quiz.questions.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'option';
            div.dataset.idx = idx;
            div.innerHTML = `<strong>${idx+1}.</strong> ${item.q}<br><span style="font-size:13px; color:#3d5a73;">${item.options.join(' ｜ ')}</span>`;
            div.addEventListener('click', function() {
                if (this.classList.contains('disabled-click')) return;
                const parent = this.parentNode;
                const allOpts = parent.querySelectorAll('.option');
                const currentIdx = Array.from(allOpts).indexOf(this);
                if (this.classList.contains('selected')) {
                    this.classList.remove('selected');
                    quizAnswers[idx] = null;
                } else {
                    allOpts.forEach((opt, j) => {
                        if (j !== currentIdx) {
                            opt.classList.remove('selected');
                            if (quizAnswers[idx] === j) quizAnswers[idx] = null;
                        }
                    });
                    this.classList.add('selected');
                    quizAnswers[idx] = currentIdx;
                }
            });
            quizContainer.appendChild(div);
        });
    }

    // 更新仪表盘
    function updateDashboard(user) {
        if (!user) return;
        currentUser = user;
        const stages = user.completed_stages || [];
        const level = getLevelFromStages(stages);
        currentLevelObj = level;
        const currentStage = getCurrentStage(stages);

        shopNameDisplay.textContent = user.name || '商家';
        levelDisplay.textContent = level.label;
        const stageInfo = STAGE_INFO[currentStage] || { title: '已完成全部阶段', desc: '恭喜！' };
        stageTitle.textContent = `📘 ${stageInfo.title}`;
        stageDesc.textContent = stageInfo.desc;

        const totalStages = 6;
        const done = Math.min(stages.length, totalStages);
        const pct = Math.round((done / totalStages) * 100);
        progressFill.style.width = pct + '%';
        stepLabel.textContent = `学习进度 ${pct}% (${done}/${totalStages})`;

        const nextLevel = level.next ? getLevelById(level.next) : null;
        nextLevelLabel.textContent = nextLevel ? `下一等级：${nextLevel.label}` : '🏆 已达最高等级';

        const stageStatus = (currentStage > 6) ? '已完成全部阶段' : `当前阶段：${currentStage}`;
        statusText.textContent = `📖 ${stageStatus} · 等级 ${level.label}`;

        if (currentStage <= 6) {
            renderQuiz(currentStage);
            submitQuizBtn.style.display = 'block';
        } else {
            quizContainer.innerHTML = '<div style="padding:12px 0;">🎉 全部阶段完成！保持运营，持续精进。</div>';
            submitQuizBtn.style.display = 'none';
        }
        learnMsg.classList.add('hidden');
        quizResult.classList.add('hidden');

        // 更新头像
        updateAvatar(user);
    }

    // 显示/隐藏模态框
    function openModal(modal) {
        modal.classList.add('open');
    }
    function closeModal(modal) {
        modal.classList.remove('open');
        // 清空消息
        const msg = modal.querySelector('.msg');
        if (msg) { msg.classList.add('hidden'); msg.textContent = ''; }
    }

    // ========== 认证 ==========
    async function handleAuth() {
        const phone = phoneInput.value.trim();
        const password = passwordInput.value.trim();
        const name = nameInput.value.trim();

        if (!phone) { showAuthMsg('请输入手机号'); return; }
        if (!password || password.length < 6) { showAuthMsg('密码至少6位'); return; }

        const hashed = hashPassword(password);

        try {
            let { data: existing, error } = await supabaseClient
                .from('merchants')
                .select('*')
                .eq('phone', phone)
                .maybeSingle();

            if (error && error.code !== 'PGRST116') throw error;

            if (existing) {
                if (existing.password !== hashed) {
                    showAuthMsg('❌ 密码错误，请重试');
                    return;
                }
                currentUser = existing;
                authCard.classList.add('hidden');
                dashboard.classList.remove('hidden');
                updateDashboard(currentUser);
                showAuthMsg(`欢迎回来，${existing.name}`, false);
            } else {
                if (!name) { showAuthMsg('请填写店铺名称'); return; }
                const newUser = {
                    phone,
                    name,
                    password: hashed,
                    level: 'beginner',
                    completed_stages: [],
                    quiz_results: {},
                    avatar_url: null,
                    created_at: new Date().toISOString()
                };
                const { data: inserted, error: insertErr } = await supabaseClient
                    .from('merchants')
                    .insert([newUser])
                    .select()
                    .single();
                if (insertErr) throw insertErr;
                currentUser = inserted;
                authCard.classList.add('hidden');
                dashboard.classList.remove('hidden');
                updateDashboard(currentUser);
                showAuthMsg(`🎉 注册成功，${name}！开始学习吧。`, false);
            }
        } catch (e) {
            showAuthMsg('❌ ' + e.message);
            console.error(e);
        }
    }

    function showAuthMsg(text, isError = true) {
        authMsg.classList.remove('hidden');
        authMsg.textContent = text;
        authMsg.className = 'msg' + (isError ? ' error' : '');
    }

    // ========== 标记学习 ==========
    async function markLearn() {
        if (!currentUser) return;
        const stages = currentUser.completed_stages || [];
        const currentStage = getCurrentStage(stages);
        if (currentStage > 6) { learnMsg.classList.remove('hidden'); learnMsg.textContent = '您已完成所有阶段！'; return; }
        if (stages.includes(currentStage)) {
            learnMsg.classList.remove('hidden');
            learnMsg.textContent = '⚠️ 本章已学习，可继续下一阶段';
            return;
        }
        const newStages = [...stages, currentStage];
        try {
            const { error } = await supabaseClient
                .from('merchants')
                .update({ completed_stages: newStages })
                .eq('id', currentUser.id);
            if (error) throw error;
            currentUser.completed_stages = newStages;
            const newLevel = getLevelFromStages(newStages);
            if (newLevel.id !== currentUser.level) {
                await supabaseClient.from('merchants').update({ level: newLevel.id }).eq('id', currentUser.id);
                currentUser.level = newLevel.id;
                learnMsg.classList.remove('hidden');
                learnMsg.textContent = `🎊 恭喜升级为 ${newLevel.label}！`;
            } else {
                learnMsg.classList.remove('hidden');
                learnMsg.textContent = '✅ 学习进度已保存！';
            }
            updateDashboard(currentUser);
        } catch (e) {
            learnMsg.classList.remove('hidden');
            learnMsg.textContent = '❌ ' + e.message;
        }
    }

    // ========== 提交考核 ==========
    async function submitQuiz() {
        if (!currentUser) return;
        const stages = currentUser.completed_stages || [];
        const currentStage = getCurrentStage(stages);
        if (currentStage > 6) return;
        const quiz = getQuizForStage(currentStage);
        if (!quiz) { quizResult.classList.remove('hidden'); quizResult.textContent = '本阶段无考核，无需提交。'; return; }

        const unanswered = quizAnswers.some(a => a === null || a === undefined);
        if (unanswered) {
            quizResult.classList.remove('hidden');
            quizResult.textContent = '⚠️ 请完成所有题目再提交。';
            return;
        }

        let correct = 0;
        quiz.questions.forEach((q, idx) => {
            if (quizAnswers[idx] === q.answer) correct++;
        });
        const passRate = Math.round((correct / quiz.questions.length) * 100);
        const level = getLevelFromStages(stages);
        const passThreshold = level.quizPass || 80;
        const passed = passRate >= passThreshold;

        const results = currentUser.quiz_results || {};
        results[`stage_${currentStage}`] = { correct, total: quiz.questions.length, passRate, passed, date: new Date().toISOString() };
        try {
            await supabaseClient.from('merchants').update({ quiz_results: results }).eq('id', currentUser.id);
            currentUser.quiz_results = results;

            if (passed && stages.includes(currentStage)) {
                const nextLevel = level.next ? getLevelById(level.next) : null;
                if (nextLevel) {
                    const requiredStages = nextLevel.stages || [];
                    const allDone = requiredStages.every(s => stages.includes(s));
                    if (allDone) {
                        await supabaseClient.from('merchants').update({ level: nextLevel.id }).eq('id', currentUser.id);
                        currentUser.level = nextLevel.id;
                        quizResult.classList.remove('hidden');
                        quizResult.textContent = `🎉 考核通过 (${passRate}%)，自动晋级 ${nextLevel.label}！`;
                        updateDashboard(currentUser);
                        return;
                    }
                }
                quizResult.classList.remove('hidden');
                quizResult.textContent = `✅ 考核通过 (${passRate}%)，继续学习下一阶段。`;
            } else {
                quizResult.classList.remove('hidden');
                quizResult.textContent = `📘 考核 ${passed ? '通过' : '未通过'} (${passRate}%，需≥${passThreshold}%)，请复习后重试。`;
            }
            updateDashboard(currentUser);
        } catch (e) {
            quizResult.classList.remove('hidden');
            quizResult.textContent = '❌ ' + e.message;
        }
    }

    // ========== 刷新 ==========
    async function refreshUser() {
        if (!currentUser) return;
        try {
            const { data, error } = await supabaseClient.from('merchants').select('*').eq('id', currentUser.id).single();
            if (error) throw error;
            currentUser = data;
            updateDashboard(currentUser);
        } catch (e) {
            alert('刷新失败: ' + e.message);
        }
    }

    // ========== 头像上传 ==========
    let selectedFile = null;

    function openAvatarModal() {
        selectedFile = null;
        avatarFileInput.value = '';
        avatarModalMsg.classList.add('hidden');
        avatarModalMsg.textContent = '';
        updateAvatar(currentUser); // 预览当前头像
        openModal(avatarModal);
    }

    avatarFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        // 预览
        const reader = new FileReader();
        reader.onload = function(ev) {
            modalAvatarPreview.style.backgroundImage = `url(${ev.target.result})`;
            modalAvatarPreview.style.backgroundSize = 'cover';
            modalAvatarPreview.style.backgroundPosition = 'center';
            modalAvatarPreview.textContent = '';
        };
        reader.readAsDataURL(file);
        selectedFile = file;
        avatarModalMsg.classList.add('hidden');
    });

    async function saveAvatar() {
        if (!selectedFile) {
            avatarModalMsg.classList.remove('hidden');
            avatarModalMsg.textContent = '请先选择一张图片。';
            return;
        }
        if (!currentUser) return;
        const fileExt = selectedFile.name.split('.').pop();
        const fileName = `${currentUser.id}_${Date.now()}.${fileExt}`;
        const filePath = `public/${fileName}`; // 使用 public 文件夹

        try {
            // 上传到 Storage
            const { data, error } = await supabaseClient.storage
                .from(STORAGE_BUCKET)
                .upload(filePath, selectedFile, {
                    cacheControl: '3600',
                    upsert: false
                });
            if (error) throw error;

            // 获取公共 URL
            const { data: urlData } = supabaseClient.storage
                .from(STORAGE_BUCKET)
                .getPublicUrl(filePath);
            const avatarUrl = urlData.publicUrl;

            // 更新数据库
            const { error: updateErr } = await supabaseClient
                .from('merchants')
                .update({ avatar_url: avatarUrl })
                .eq('id', currentUser.id);
            if (updateErr) throw updateErr;

            currentUser.avatar_url = avatarUrl;
            updateAvatar(currentUser);
            avatarModalMsg.classList.remove('hidden');
            avatarModalMsg.textContent = '✅ 头像已更新！';
            avatarModalMsg.className = 'msg';
            setTimeout(() => closeModal(avatarModal), 1000);
        } catch (e) {
            avatarModalMsg.classList.remove('hidden');
            avatarModalMsg.textContent = '❌ ' + e.message;
            avatarModalMsg.className = 'msg error';
        }
    }

    // ========== 更改密码 ==========
    function openPasswordModal() {
        oldPasswordInput.value = '';
        newPasswordInput.value = '';
        confirmPasswordInput.value = '';
        passwordModalMsg.classList.add('hidden');
        passwordModalMsg.textContent = '';
        openModal(passwordModal);
    }

    async function savePassword() {
        const old = oldPasswordInput.value.trim();
        const newPwd = newPasswordInput.value.trim();
        const confirm = confirmPasswordInput.value.trim();

        if (!old || !newPwd || !confirm) {
            passwordModalMsg.classList.remove('hidden');
            passwordModalMsg.textContent = '请填写所有字段。';
            return;
        }
        if (newPwd.length < 6) {
            passwordModalMsg.classList.remove('hidden');
            passwordModalMsg.textContent = '新密码至少6位。';
            return;
        }
        if (newPwd !== confirm) {
            passwordModalMsg.classList.remove('hidden');
            passwordModalMsg.textContent = '两次输入的新密码不一致。';
            return;
        }

        // 验证旧密码
        const hashedOld = hashPassword(old);
        if (hashedOld !== currentUser.password) {
            passwordModalMsg.classList.remove('hidden');
            passwordModalMsg.textContent = '❌ 旧密码错误。';
            return;
        }

        const hashedNew = hashPassword(newPwd);
        try {
            const { error } = await supabaseClient
                .from('merchants')
                .update({ password: hashedNew })
                .eq('id', currentUser.id);
            if (error) throw error;
            currentUser.password = hashedNew;
            passwordModalMsg.classList.remove('hidden');
            passwordModalMsg.textContent = '✅ 密码已更改！';
            passwordModalMsg.className = 'msg';
            setTimeout(() => closeModal(passwordModal), 1000);
        } catch (e) {
            passwordModalMsg.classList.remove('hidden');
            passwordModalMsg.textContent = '❌ ' + e.message;
            passwordModalMsg.className = 'msg error';
        }
    }

    // ========== 退出登录 ==========
    function logout() {
        if (confirm('确定要退出登录吗？')) {
            currentUser = null;
            dashboard.classList.add('hidden');
            authCard.classList.remove('hidden');
            // 清空输入
            phoneInput.value = '';
            passwordInput.value = '';
            nameInput.value = '';
            authMsg.classList.add('hidden');
            // 关闭下拉
            dropdownMenu.classList.remove('open');
        }
    }

    // ========== 下拉菜单控制 ==========
    avatarWrapper.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdownMenu.classList.toggle('open');
    });

    document.addEventListener('click', function(e) {
        if (!avatarWrapper.contains(e.target)) {
            dropdownMenu.classList.remove('open');
        }
    });

    // ========== 事件绑定 ==========
    authBtn.addEventListener('click', handleAuth);
    markLearnBtn.addEventListener('click', markLearn);
    submitQuizBtn.addEventListener('click', submitQuiz);
    refreshBtn.addEventListener('click', refreshUser);

    // 头像相关
    changeAvatarBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdownMenu.classList.remove('open');
        openAvatarModal();
    });
    avatarCancelBtn.addEventListener('click', function() { closeModal(avatarModal); });
    avatarSaveBtn.addEventListener('click', saveAvatar);

    // 密码相关
    changePasswordBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdownMenu.classList.remove('open');
        openPasswordModal();
    });
    passwordCancelBtn.addEventListener('click', function() { closeModal(passwordModal); });
    passwordSaveBtn.addEventListener('click', savePassword);

    logoutBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdownMenu.classList.remove('open');
        logout();
    });

    // 回车
    phoneInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') handleAuth(); });
    passwordInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') handleAuth(); });
    nameInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') handleAuth(); });

    console.log('🐿️ 松鼠逛逛商家学堂 (含头像/密码管理)');
</script>
</body>
</html>
