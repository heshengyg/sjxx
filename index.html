<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>松鼠逛逛 · 商家学堂</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <!-- 头部 -->
    <div class="header">
        <div class="header-left">
            <h1>🐿️ 松鼠逛逛</h1>
            <span class="badge">商家学堂</span>
        </div>
        <div class="avatar-wrapper" id="avatarWrapper">
            <div class="avatar-circle" id="avatarCircle">商</div>
            <div class="dropdown-menu" id="dropdownMenu">
                <button class="dropdown-item" id="changeAvatarBtn">🖼️ 更改头像</button>
                <button class="dropdown-item" id="changePasswordBtn">🔑 更改密码</button>
                <button class="dropdown-item danger" id="logoutBtn">🚪 退出登录</button>
            </div>
        </div>
    </div>
    <div class="sub">分级学习 · 自动晋级 · 免费赋能</div>

    <!-- 登录卡片 -->
    <div id="authCard" class="card">
        <div class="auth-title">商家身份</div>
        <input id="phoneInput" class="input-field" type="text" placeholder="手机号 (注册/登录)" />
        <input id="passwordInput" class="input-field" type="password" placeholder="密码 (6位以上)" />
        <input id="nameInput" class="input-field" type="text" placeholder="店铺名称 (首次注册时填写)" />
        <button id="authBtn" class="btn">注册 / 登录</button>
        <div id="authMsg" class="msg hidden"></div>
    </div>

    <!-- 主面板 -->
    <div id="dashboard" class="hidden">
        <div class="user-info">
            <span class="shop-name" id="shopNameDisplay">——</span>
            <span id="levelDisplay" class="level-tag">入门商家</span>
        </div>
        <div class="status" id="statusText">📖 当前阶段：第一阶段</div>
        <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-labels">
            <span id="stepLabel">学习进度 0%</span>
            <span id="nextLevelLabel">下一等级：进阶商家</span>
        </div>

        <!-- 阶段导航（卡片式） -->
        <div class="stage-nav">
            <label>切换阶段：</label>
            <div id="stageList" class="stage-list"></div>
        </div>

        <!-- 学习资源 -->
        <div id="studyArea" class="card">
            <div id="stageTitle" class="stage-title">📘 第一阶段：认知破局</div>
            <div id="stageDesc" class="stage-desc"></div>
            <div id="resourcesContainer"></div>
            <div id="learnMsg" class="msg hidden"></div>
        </div>

        <!-- 考核 -->
        <div class="quiz-area">
            <div class="quiz-title">📝 阶段考核</div>
            <div id="quizContainer"></div>
            <button id="submitQuizBtn" class="btn submit-btn">✅ 提交考核</button>
            <div id="quizResult" class="msg hidden"></div>
        </div>

        <div class="actions">
            <button id="refreshBtn" class="btn btn-outline">🔄 刷新状态</button>
        </div>
        <div class="footnote">系统自动考核 · 达标即晋级</div>
    </div>

    <!-- 资源详情模态框 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-card modal-large">
            <div class="modal-header">
                <h3 id="detailTitle">标题</h3>
                <button class="modal-close" id="detailCloseBtn">&times;</button>
            </div>
            <div id="detailBody"></div>
            <div id="detailProgress" class="progress-info"></div>
        </div>
    </div>

    <!-- 头像模态框 -->
    <div class="modal-overlay" id="avatarModal">
        <div class="modal-card">
            <h3>🖼️ 更改头像</h3>
            <div style="text-align:center; margin-bottom:12px;">
                <div class="avatar-circle" id="modalAvatarPreview" style="width:80px; height:80px; font-size:32px; margin:0 auto;">商</div>
            </div>
            <label class="upload-label" for="avatarFileInput">📁 选择图片 (≤50KB)</label>
            <input type="file" id="avatarFileInput" accept="image/*">
            <div id="avatarModalMsg" class="msg hidden"></div>
            <div class="btn-row">
                <button class="btn" id="avatarSaveBtn">保存头像</button>
                <button class="btn btn-outline" id="avatarCancelBtn">取消</button>
            </div>
        </div>
    </div>

    <!-- 密码模态框 -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-card">
            <h3>🔑 更改密码</h3>
            <input type="password" id="oldPasswordInput" class="input-field" placeholder="旧密码">
            <input type="password" id="newPasswordInput" class="input-field" placeholder="新密码 (至少6位)">
            <input type="password" id="confirmPasswordInput" class="input-field" placeholder="确认新密码">
            <div id="passwordModalMsg" class="msg hidden"></div>
            <div class="btn-row">
                <button class="btn" id="passwordSaveBtn">保存密码</button>
                <button class="btn btn-outline" id="passwordCancelBtn">取消</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="app.js"></script>
</body>
</html>
