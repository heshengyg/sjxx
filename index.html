<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>松鼠逛逛 · 商家学堂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 20, 30, 0.08);
            padding: 24px 20px 30px;
            transition: all 0.2s ease;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a2e3b;
            letter-spacing: -0.3px;
        }
        .badge {
            background: #eef5f0;
            color: #1f7b4d;
            font-size: 12px;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 30px;
            margin-left: 8px;
        }
        .sub {
            color: #5e6f7d;
            font-size: 14px;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ecf0f3;
        }
        .card {
            background: #f8faff;
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 16px;
            border: 1px solid #eef2f6;
        }
        .label {
            font-size: 13px;
            font-weight: 500;
            color: #2b4a5e;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .level-tag {
            background: #1a2e3b;
            color: white;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
        }
        .status {
            font-size: 14px;
            color: #1f2e3a;
            margin: 8px 0 4px;
        }
        .progress-wrap {
            background: #e6eaef;
            height: 8px;
            border-radius: 20px;
            margin: 12px 0 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #1f7b4d;
            border-radius: 20px;
            transition: width 0.4s ease;
        }
        .btn {
            background: #1a2e3b;
            border: none;
            color: white;
            font-weight: 500;
            font-size: 15px;
            padding: 14px 18px;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 12px rgba(26, 46, 59, 0.08);
            margin-top: 6px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #d0d9e2;
            color: #1f2e3a;
            box-shadow: none;
        }
        .btn-outline:active { background: #f0f4fa; }
        .gap { height: 10px; }
        .flex-row {
            display: flex;
            gap: 10px;
        }
        .flex-row .btn { width: auto; flex: 1; }
        .quiz-area {
            margin-top: 20px;
            border-top: 1px solid #e4eaf0;
            padding-top: 18px;
        }
        .quiz-title {
            font-weight: 600;
            color: #1a2e3b;
            margin-bottom: 12px;
        }
        .option {
            background: #f2f6fc;
            padding: 12px 16px;
            border-radius: 40px;
            margin-bottom: 8px;
            font-size: 14px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: 0.1s;
        }
        .option.selected {
            border-color: #1f7b4d;
            background: #e3f3ea;
        }
        .option.correct { background: #d4edda; border-color: #1f7b4d; }
        .option.wrong { background: #f8dddd; border-color: #b33; }
        .disabled-click { pointer-events: none; opacity: 0.8; }
        .msg {
            background: #eef5f0;
            padding: 10px 14px;
            border-radius: 40px;
            color: #1a4d33;
            font-size: 14px;
            margin: 12px 0 8px;
        }
        .footnote {
            font-size: 12px;
            color: #7b8b9a;
            text-align: center;
            margin-top: 20px;
        }
        .hidden { display: none; }
        .flex { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 40px;
            border: 1px solid #dce3eb;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border-color: #1f7b4d;
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="header">
        <h1>🐿️ 松鼠逛逛</h1>
        <span class="badge">商家学堂</span>
    </div>
    <div class="sub">分级学习 · 自动晋级 · 免费赋能</div>

    <!-- 注册/登录卡片 -->
    <div id="authCard" class="card">
        <div style="font-weight:600; margin-bottom:12px;">商家身份</div>
        <input id="phoneInput" type="text" placeholder="手机号 (注册/登录)" />
        <input id="passwordInput" type="password" placeholder="密码 (6位以上)" />
        <input id="nameInput" type="text" placeholder="店铺名称 (首次注册时填写)" />
        <button id="authBtn" class="btn">注册 / 登录</button>
        <div id="authMsg" class="msg hidden"></div>
    </div>

    <!-- 主面板 (登录后) -->
    <div id="dashboard" class="hidden">
        <div class="flex" style="justify-content:space-between; margin-bottom:6px;">
            <span style="font-weight:600; font-size:18px;" id="shopNameDisplay">——</span>
            <span id="levelDisplay" class="level-tag">入门商家</span>
        </div>
        <div class="status" id="statusText">📖 当前阶段：第一阶段 · 认知破局</div>
        <div class="progress-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <div style="display:flex; justify-content:space-between; font-size:13px; color:#4d6677; margin:4px 0 12px;">
            <span id="stepLabel">学习进度 0%</span>
            <span id="nextLevelLabel">下一等级：进阶商家</span>
        </div>

        <!-- 学习内容区域 -->
        <div id="studyArea" class="card" style="background:#fafdff;">
            <div id="stageTitle" style="font-weight:600; font-size:16px; margin-bottom:6px;">📘 第一阶段：认知破局</div>
            <div id="stageDesc" style="font-size:14px; color:#2e4a5e; line-height:1.5;">传统实体经营困境深度解析</div>
            <div style="margin:12px 0 8px; display:flex; gap:6px; flex-wrap:wrap;">
                <span class="badge" style="background:#e1e9f2; color:#1a3b4f;">必修</span>
                <span class="badge" style="background:#e1e9f2; color:#1a3b4f;">1-3天</span>
            </div>
            <button id="markLearnBtn" class="btn" style="background:#2b5e7a;">📌 标记本章已学</button>
            <div id="learnMsg" class="msg hidden"></div>
        </div>

        <!-- 考核区 -->
        <div class="quiz-area" id="quizArea">
            <div class="quiz-title" id="quizTitle">📝 阶段考核</div>
            <div id="quizContainer"></div>
            <button id="submitQuizBtn" class="btn" style="background:#1f7b4d; margin-top:12px;">✅ 提交考核</button>
            <div id="quizResult" class="msg hidden"></div>
        </div>

        <!-- 晋级/状态 -->
        <div style="display:flex; gap:8px; margin-top:16px;">
            <button id="refreshBtn" class="btn btn-outline" style="font-size:14px;">🔄 刷新状态</button>
        </div>
        <div class="footnote">系统自动考核 · 达标即晋级</div>
    </div>
</div>

<!-- Supabase SDK + CryptoJS (SHA-256) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
    // ========== 配置 ==========
    const SUPABASE_URL = 'https://sjgegoibummrvyuhehco.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qnadIPVLPkAgIe5w_aR0lg_zy7VnqPC';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ========== 哈希函数 ==========
    function hashPassword(password) {
        return CryptoJS.SHA256(password).toString();
    }

    // ========== 等级定义 ==========
    const LEVELS = [
        { id: 'beginner', label: '入门商家', stages: [1,2], quizPass: 80, next: 'advanced' },
        { id: 'advanced', label: '进阶商家', stages: [3,4], quizPass: 85, next: 'senior' },
        { id: 'senior', label: '资深商家', stages: [5], quizPass: 90, next: 'elite' },
        { id: 'elite', label: '精英商家', stages: [6], quizPass: 90, next: null }
    ];

    const STAGE_INFO = {
        1: { title: '第一阶段：认知破局', desc: '传统实体经营困境深度解析' },
        2: { title: '第二阶段：方向定位', desc: '社区商家专属新零售突破路径' },
        3: { title: '第三阶段：资源深挖', desc: '社区优势与私域工具升级' },
        4: { title: '第四阶段：平台认知', desc: '松鼠逛逛核心功能全景讲解' },
        5: { title: '第五阶段：商家实操', desc: '商家端全功能精细化教学' },
        6: { title: '第六阶段：运营进阶', desc: '日常落地营销技巧 (增收必修)' }
    };

    // ========== 题库 ==========
    const QUIZ_DB = {
        1: {
            questions: [
                { q: '传统社区实体门店最核心的经营痛点是？', options: ['A、客源仅靠自然到店，客流固化流失严重', 'B、门店装修老旧', 'C、人工成本过低', 'D、邻里竞争太少'], answer: 0 },
                { q: '传统实体店闭店后最大的问题是？', options: ['A、门店无人看管', 'B、彻底失去营收机会，无法全天候经营', 'C、设备闲置', 'D、无卫生打扫'], answer: 1 },
                { q: '线下发传单、地推促销的最大弊端是？', options: ['A、操作简单', 'B、投入成本高、转化效率极低', 'C、覆盖人群广', 'D、无时间限制'], answer: 1 }
            ]
        },
        2: {
            questions: [
                { q: '社区新零售的核心载体是？', options: ['A、纯线下门店', 'B、线下门店为支点，线上平台为流量交易载体', 'C、纯微信群聊天', 'D、远距离传统电商'], answer: 1 },
                { q: '社区商家转型的核心身份转变是？', options: ['A、从卖货商家转为社区综合生活服务提供者', 'B、从线下经营转为完全线上经营', 'C、从服务邻里转为单纯赚佣金', 'D、从实体门店转为无门店经营'], answer: 0 },
                { q: '纯微信群运营最大的短板是？', options: ['A、沟通便捷', 'B、无法形成交易、锁客、变现的商业闭环', 'C、触达精准', 'D、免费使用'], answer: 1 }
            ]
        },
        3: {
            questions: [
                { q: '商家入驻松鼠逛逛、开通线上店铺是否免费？', options: ['A、免费', 'B、收费'], answer: 0 },
                { q: '次日达供应链商品需要商家自行备货、发货吗？', options: ['A、需要', 'B、不需要'], answer: 1 },
                { q: '商家自营店铺可以24小时线上接单售卖吗？', options: ['A、可以', 'B、不可以'], answer: 0 }
            ]
        },
        4: {
            questions: [
                { q: '松鼠逛逛平台三大核心功能板块是？', options: ['A、次日达+商家自营+邻里信息', 'B、直播带货+社群团购', 'C、外卖配送+家政服务'], answer: 0 },
                { q: '商家开通次日达服务的核心权益是？', options: ['A、自行囤货售卖', 'B、推广平台商品赚取佣金，门店作为自提点', 'C、承担物流配送'], answer: 1 }
            ]
        },
        5: {
            questions: [
                { q: '商家后台无法实现的功能是？', options: ['A、订单管理、核销售后', 'B、佣金查询、收益提现', 'C、恶意修改平台数据'], answer: 2 },
                { q: '店铺线上装修、信息完善的目的是？', options: ['A、提升门店线上形象，增强邻里信任', 'B、满足平台形式要求', 'C、无实际经营意义'], answer: 0 }
            ]
        },
        6: {
            questions: [
                { q: '社区社群运营的核心原则是？', options: ['A、频繁硬广刷屏', 'B、便民服务为主、营销为辅，保持社群活跃', 'C、长期不发言、不互动'], answer: 1 },
                { q: '精英商家保级的核心要求不包括？', options: ['A、店铺常态化运营', 'B、大量虚假宣传引流', 'C、月度有成交、零重大客诉'], answer: 1 }
            ]
        }
    };

    // 当前用户状态
    let currentUser = null;
    let currentLevelObj = null;
    let quizAnswers = [];

    // DOM 引用
    const authCard = document.getElementById('authCard');
    const dashboard = document.getElementById('dashboard');
    const phoneInput = document.getElementById('phoneInput');
    const passwordInput = document.getElementById('passwordInput');
    const nameInput = document.getElementById('nameInput');
    const authBtn = document.getElementById('authBtn');
    const authMsg = document.getElementById('authMsg');
    const shopNameDisplay = document.getElementById('shopNameDisplay');
    const levelDisplay = document.getElementById('levelDisplay');
    const statusText = document.getElementById('statusText');
    const progressFill = document.getElementById('progressFill');
    const stepLabel = document.getElementById('stepLabel');
    const nextLevelLabel = document.getElementById('nextLevelLabel');
    const stageTitle = document.getElementById('stageTitle');
    const stageDesc = document.getElementById('stageDesc');
    const markLearnBtn = document.getElementById('markLearnBtn');
    const learnMsg = document.getElementById('learnMsg');
    const quizContainer = document.getElementById('quizContainer');
    const submitQuizBtn = document.getElementById('submitQuizBtn');
    const quizResult = document.getElementById('quizResult');
    const refreshBtn = document.getElementById('refreshBtn');

    // ========== 辅助函数 ==========
    function getLevelFromStages(stages) {
        if (!stages || stages.length === 0) return LEVELS[0];
        const maxStage = Math.max(...stages);
        if (maxStage >= 6) return LEVELS[3];
        if (maxStage >= 4) return LEVELS[2];
        if (maxStage >= 3) return LEVELS[1];
        return LEVELS[0];
    }

    function getCurrentStage(stages) {
        if (!stages || stages.length === 0) return 1;
        const max = Math.max(...stages);
        if (max >= 6) return 6;
        return max + 1;
    }

    function getLevelById(id) {
        return LEVELS.find(l => l.id === id) || LEVELS[0];
    }

    function getQuizForStage(stage) {
        return QUIZ_DB[stage] || null;
    }

    function renderQuiz(stage) {
        const quiz = getQuizForStage(stage);
        quizContainer.innerHTML = '';
        quizResult.classList.add('hidden');
        if (!quiz) {
            quizContainer.innerHTML = '<div style="padding:12px 0; color:#5e6f7d;">📭 本阶段暂无考核，可继续学习。</div>';
            submitQuizBtn.disabled = true;
            submitQuizBtn.style.opacity = 0.6;
            return;
        }
        submitQuizBtn.disabled = false;
        submitQuizBtn.style.opacity = 1;
        quizAnswers = new Array(quiz.questions.length).fill(null);
        quiz.questions.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'option';
            div.dataset.idx = idx;
            div.innerHTML = `<strong>${idx+1}.</strong> ${item.q}<br><span style="font-size:13px; color:#3d5a73;">${item.options.join(' ｜ ')}</span>`;
            div.addEventListener('click', function(e) {
                if (this.classList.contains('disabled-click')) return;
                const parent = this.parentNode;
                const allOpts = parent.querySelectorAll('.option');
                const currentIdx = Array.from(allOpts).indexOf(this);
                if (this.classList.contains('selected')) {
                    this.classList.remove('selected');
                    quizAnswers[idx] = null;
                } else {
                    allOpts.forEach((opt, j) => {
                        if (j !== currentIdx) {
                            opt.classList.remove('selected');
                            if (quizAnswers[idx] === j) quizAnswers[idx] = null;
                        }
                    });
                    this.classList.add('selected');
                    quizAnswers[idx] = currentIdx;
                }
            });
            quizContainer.appendChild(div);
        });
    }

    function updateDashboard(user) {
        if (!user) return;
        currentUser = user;
        const stages = user.completed_stages || [];
        const level = getLevelFromStages(stages);
        currentLevelObj = level;
        const currentStage = getCurrentStage(stages);

        shopNameDisplay.textContent = user.name || '商家';
        levelDisplay.textContent = level.label;
        const stageInfo = STAGE_INFO[currentStage] || { title: '已完成全部阶段', desc: '恭喜！' };
        stageTitle.textContent = `📘 ${stageInfo.title}`;
        stageDesc.textContent = stageInfo.desc;

        const totalStages = 6;
        const done = Math.min(stages.length, totalStages);
        const pct = Math.round((done / totalStages) * 100);
        progressFill.style.width = pct + '%';
        stepLabel.textContent = `学习进度 ${pct}% (${done}/${totalStages})`;

        const nextLevel = level.next ? getLevelById(level.next) : null;
        nextLevelLabel.textContent = nextLevel ? `下一等级：${nextLevel.label}` : '🏆 已达最高等级';

        const stageStatus = (currentStage > 6) ? '已完成全部阶段' : `当前阶段：${currentStage}`;
        statusText.textContent = `📖 ${stageStatus} · 等级 ${level.label}`;

        if (currentStage <= 6) {
            renderQuiz(currentStage);
            submitQuizBtn.style.display = 'block';
        } else {
            quizContainer.innerHTML = '<div style="padding:12px 0;">🎉 全部阶段完成！保持运营，持续精进。</div>';
            submitQuizBtn.style.display = 'none';
        }
        learnMsg.classList.add('hidden');
        quizResult.classList.add('hidden');
    }

    // ========== 认证 ==========
    async function handleAuth() {
        const phone = phoneInput.value.trim();
        const password = passwordInput.value.trim();
        const name = nameInput.value.trim();

        if (!phone) { showAuthMsg('请输入手机号'); return; }
        if (!password || password.length < 6) { showAuthMsg('密码至少6位'); return; }

        const hashed = hashPassword(password);

        try {
            // 查询是否已存在
            let { data: existing, error } = await supabaseClient
                .from('merchants')
                .select('*')
                .eq('phone', phone)
                .maybeSingle();

            if (error && error.code !== 'PGRST116') throw error;

            if (existing) {
                // 登录验证密码
                if (existing.password !== hashed) {
                    showAuthMsg('❌ 密码错误，请重试');
                    return;
                }
                currentUser = existing;
                authCard.classList.add('hidden');
                dashboard.classList.remove('hidden');
                updateDashboard(currentUser);
                showAuthMsg(`欢迎回来，${existing.name}`, false);
            } else {
                // 注册
                if (!name) { showAuthMsg('请填写店铺名称'); return; }
                const newUser = {
                    phone,
                    name,
                    password: hashed,
                    level: 'beginner',
                    completed_stages: [],
                    quiz_results: {},
                    created_at: new Date().toISOString()
                };
                const { data: inserted, error: insertErr } = await supabaseClient
                    .from('merchants')
                    .insert([newUser])
                    .select()
                    .single();
                if (insertErr) throw insertErr;
                currentUser = inserted;
                authCard.classList.add('hidden');
                dashboard.classList.remove('hidden');
                updateDashboard(currentUser);
                showAuthMsg(`🎉 注册成功，${name}！开始学习吧。`, false);
            }
        } catch (e) {
            showAuthMsg('❌ ' + e.message);
            console.error(e);
        }
    }

    function showAuthMsg(text, isError = true) {
        authMsg.classList.remove('hidden');
        authMsg.textContent = text;
        if (!isError) {
            authMsg.style.background = '#e3f3ea';
            authMsg.style.color = '#1a4d33';
        } else {
            authMsg.style.background = '#f8dddd';
            authMsg.style.color = '#8b3a3a';
        }
    }

    // ========== 标记学习 ==========
    async function markLearn() {
        if (!currentUser) return;
        const stages = currentUser.completed_stages || [];
        const currentStage = getCurrentStage(stages);
        if (currentStage > 6) { learnMsg.classList.remove('hidden'); learnMsg.textContent = '您已完成所有阶段！'; return; }
        if (stages.includes(currentStage)) {
            learnMsg.classList.remove('hidden');
            learnMsg.textContent = '⚠️ 本章已学习，可继续下一阶段';
            return;
        }
        const newStages = [...stages, currentStage];
        try {
            const { error } = await supabaseClient
                .from('merchants')
                .update({ completed_stages: newStages })
                .eq('id', currentUser.id);
            if (error) throw error;
            currentUser.completed_stages = newStages;
            const newLevel = getLevelFromStages(newStages);
            if (newLevel.id !== currentUser.level) {
                await supabaseClient.from('merchants').update({ level: newLevel.id }).eq('id', currentUser.id);
                currentUser.level = newLevel.id;
                learnMsg.classList.remove('hidden');
                learnMsg.textContent = `🎊 恭喜升级为 ${newLevel.label}！`;
            } else {
                learnMsg.classList.remove('hidden');
                learnMsg.textContent = '✅ 学习进度已保存！';
            }
            updateDashboard(currentUser);
        } catch (e) {
            learnMsg.classList.remove('hidden');
            learnMsg.textContent = '❌ ' + e.message;
        }
    }

    // ========== 提交考核 ==========
    async function submitQuiz() {
        if (!currentUser) return;
        const stages = currentUser.completed_stages || [];
        const currentStage = getCurrentStage(stages);
        if (currentStage > 6) return;
        const quiz = getQuizForStage(currentStage);
        if (!quiz) { quizResult.classList.remove('hidden'); quizResult.textContent = '本阶段无考核，无需提交。'; return; }

        const unanswered = quizAnswers.some(a => a === null || a === undefined);
        if (unanswered) {
            quizResult.classList.remove('hidden');
            quizResult.textContent = '⚠️ 请完成所有题目再提交。';
            return;
        }

        let correct = 0;
        quiz.questions.forEach((q, idx) => {
            if (quizAnswers[idx] === q.answer) correct++;
        });
        const passRate = Math.round((correct / quiz.questions.length) * 100);
        const level = getLevelFromStages(stages);
        const passThreshold = level.quizPass || 80;
        const passed = passRate >= passThreshold;

        const results = currentUser.quiz_results || {};
        results[`stage_${currentStage}`] = { correct, total: quiz.questions.length, passRate, passed, date: new Date().toISOString() };
        try {
            await supabaseClient.from('merchants').update({ quiz_results: results }).eq('id', currentUser.id);
            currentUser.quiz_results = results;

            if (passed && stages.includes(currentStage)) {
                const nextLevel = level.next ? getLevelById(level.next) : null;
                if (nextLevel) {
                    const requiredStages = nextLevel.stages || [];
                    const allDone = requiredStages.every(s => stages.includes(s));
                    if (allDone) {
                        await supabaseClient.from('merchants').update({ level: nextLevel.id }).eq('id', currentUser.id);
                        currentUser.level = nextLevel.id;
                        quizResult.classList.remove('hidden');
                        quizResult.textContent = `🎉 考核通过 (${passRate}%)，自动晋级 ${nextLevel.label}！`;
                        updateDashboard(currentUser);
                        return;
                    }
                }
                quizResult.classList.remove('hidden');
                quizResult.textContent = `✅ 考核通过 (${passRate}%)，继续学习下一阶段。`;
            } else {
                quizResult.classList.remove('hidden');
                quizResult.textContent = `📘 考核 ${passed ? '通过' : '未通过'} (${passRate}%，需≥${passThreshold}%)，请复习后重试。`;
            }
            updateDashboard(currentUser);
        } catch (e) {
            quizResult.classList.remove('hidden');
            quizResult.textContent = '❌ ' + e.message;
        }
    }

    // ========== 刷新 ==========
    async function refreshUser() {
        if (!currentUser) return;
        try {
            const { data, error } = await supabaseClient.from('merchants').select('*').eq('id', currentUser.id).single();
            if (error) throw error;
            currentUser = data;
            updateDashboard(currentUser);
        } catch (e) {
            alert('刷新失败: ' + e.message);
        }
    }

    // ========== 事件绑定 ==========
    authBtn.addEventListener('click', handleAuth);
    markLearnBtn.addEventListener('click', markLearn);
    submitQuizBtn.addEventListener('click', submitQuiz);
    refreshBtn.addEventListener('click', refreshUser);

    // 回车提交
    phoneInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') handleAuth(); });
    passwordInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') handleAuth(); });
    nameInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') handleAuth(); });

    console.log('🐿️ 松鼠逛逛商家学堂已启动 (密码版)');
</script>
